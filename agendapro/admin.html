<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Plataforma — AgendaPro</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0F172A" />
<link rel="icon" type="image/png" href="icones/icone-192.png" />
<style>
/* ===========================================================================
   AgendaPro — o painel de quem é dono da plataforma
   ---------------------------------------------------------------------------
   Esta tela não é o sistema do salão: é o negócio olhando para si mesmo.
   Quem abre vê quantos salões existem, quanto entra por mês, quem está
   testando e quem some semana que vem.

   Escura de propósito, e diferente das outras. Não é enfeite: é para você
   saber, num relance, que a conta logada aqui é a que enxerga TODOS os
   salões. Tela que parece com a do salão convida a esquecer disso.

   Ela não decide nada sobre permissão. Quem decide é o `is_super()` no banco,
   na primeira linha de cada função. Se você abrir esta página com uma conta
   comum, ela carrega e o banco recusa — que é a ordem certa: a tela é
   conveniência, a tranca é do banco.
   =========================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
body{
  font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:#0F172A;color:#E8EEF7;
  padding:26px 20px calc(60px + env(safe-area-inset-bottom));
}
.folha{max-width:1180px;margin:0 auto}

.topo{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.topo img{height:30px;width:auto}
.selo{
  font-size:10.5px;font-weight:700;letter-spacing:.11em;padding:3px 9px;
  border-radius:99px;background:rgba(124,58,237,.18);color:#C4B5FD;
  border:1px solid rgba(124,58,237,.38);
}
.sair{margin-left:auto;color:rgba(232,238,247,.55);font-size:13.5px;font-weight:550}
.sair:hover{color:#E8EEF7}
.subtopo{color:rgba(237,244,243,.5);font-size:14px;margin-bottom:26px}

/* ── Os números do topo ─────────────────────────────────────────────────── */
.placar{
  display:grid;gap:11px;margin-bottom:26px;
  grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
}
.cartao{
  background:#1B2740;border:1px solid rgba(37,99,235,.15);
  border-radius:11px;padding:15px 16px;
}
.cartao .rot{
  font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(237,244,243,.42);margin-bottom:5px;
}
.cartao .val{font-size:27px;font-weight:640;letter-spacing:-.03em;line-height:1.15}
.cartao .pe{font-size:12px;color:rgba(237,244,243,.42);margin-top:3px}
.cartao.dinheiro{border-color:rgba(74,222,128,.26);background:rgba(74,222,128,.05)}
.cartao.dinheiro .val{color:#4ADE80}
.cartao.alerta{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.06)}
.cartao.alerta .val{color:#FB7185}

h2{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(237,244,243,.42);margin:30px 0 11px;
}

/* ── Quem precisa de telefonema ─────────────────────────────────────────── */
.ligar{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:rgba(251,113,133,.07);border:1px solid rgba(251,113,133,.24);
  border-left:3px solid #FB7185;border-radius:9px;padding:13px 15px;margin-bottom:7px;
}
.ligar .quem{font-weight:600}
.ligar .qdo{color:#FB7185;font-size:13px;font-weight:600}
.ligar .uso{color:rgba(237,244,243,.5);font-size:13px}
.ligar a{
  margin-left:auto;color:#4ADE80;font-weight:600;font-size:13.5px;
  text-decoration:none;white-space:nowrap;
}
.ligar a:hover{text-decoration:underline}

/* ── A lista ────────────────────────────────────────────────────────────── */
.rolo{overflow-x:auto;border-radius:11px;border:1px solid rgba(37,99,235,.15)}
table{width:100%;border-collapse:collapse;background:#1B2740;font-size:14px}
th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:rgba(237,244,243,.4);
  padding:11px 13px;border-bottom:1px solid rgba(37,99,235,.15);white-space:nowrap;
}
td{padding:11px 13px;border-bottom:1px solid rgba(37,99,235,.08);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(37,99,235,.05)}
td .nome{font-weight:600}
td .slug{font-size:12px;color:rgba(237,244,243,.38);font-family:ui-monospace,monospace}
.etq{
  display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;
  border-radius:99px;white-space:nowrap;
}
.etq.pago{background:rgba(74,222,128,.14);color:#4ADE80}
.etq.teste{background:rgba(251,191,36,.14);color:#FBBF24}
.etq.gratis{background:rgba(237,244,243,.08);color:rgba(232,238,247,.55)}
.etq.ruim{background:rgba(251,113,133,.14);color:#FB7185}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.morto{color:rgba(237,244,243,.34)}
select.plano{
  background:#0F172A;border:1px solid rgba(37,99,235,.26);border-radius:7px;
  padding:6px 9px;font-size:13px;min-width:118px;
}
.acao{
  font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;
  border:1px solid rgba(37,99,235,.26);color:rgba(237,244,243,.72);
}
.acao:hover{border-color:rgba(37,99,235,.5);color:#E8EEF7}
.acao.perigo:hover{border-color:rgba(251,113,133,.55);color:#FB7185}

.recado{
  padding:15px 18px;border-radius:10px;background:#1B2740;
  border-left:3px solid #2563EB;line-height:1.6;
}
.recado.erro{border-left-color:#FB7185;background:rgba(251,113,133,.07)}
.recado b{display:block;margin-bottom:3px}
.recado code{
  background:#0F172A;padding:1px 6px;border-radius:4px;font-size:12.5px;
  border:1px solid rgba(37,99,235,.2);
}
.vazio{padding:22px;text-align:center;color:rgba(237,244,243,.42);font-size:14px}

@media (max-width:700px){
  body{padding:18px 13px 50px}
  .cartao .val{font-size:23px}
  th,td{padding:9px 10px}
}
</style>
</head>
<body>
<div class="folha">

  <div class="topo">
    <img src="icones/logotipo-branco.svg" alt="AgendaPro">
    <span class="selo">PLATAFORMA</span>
    <button class="sair" onclick="sair()">Sair</button>
  </div>
  <p class="subtopo" id="subtopo">Carregando…</p>

  <div id="corpo"></div>
</div>

<script src="config.js"></script>
<script src="dados.js"></script>
<script>
'use strict';

let painel = null;

const real = v => (Number(v) || 0)
  .toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const escapar = t => String(t == null ? '' : t)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function data(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

// "há 3 dias" diz mais que uma data quando a pergunta é "este salão está
// vivo?". Data exige que você faça a conta de cabeça; isto já responde.
function desde(d){
  if(!d) return 'nunca usou';
  const dias = Math.floor((Date.now() - new Date(d)) / 864e5);
  if(dias <= 0) return 'hoje';
  if(dias === 1) return 'ontem';
  if(dias < 30) return 'há ' + dias + ' dias';
  if(dias < 60) return 'há 1 mês';
  return 'há ' + Math.floor(dias / 30) + ' meses';
}

function zap(numero){
  const so = String(numero || '').replace(/\D/g, '');
  return so.length >= 10 ? 'https://wa.me/' + (so.length <= 11 ? '55' + so : so) : null;
}

/* ── Carregar ─────────────────────────────────────────────────────────────
   Quem barra não é esta tela: é o `is_super()` na primeira linha da função no
   banco. Aqui só se traduz a recusa para uma frase que diga o que fazer.
   ──────────────────────────────────────────────────────────────────────── */
async function carregar(){
  const corpo = document.getElementById('corpo');
  /* ── TRÊS RECUSAS DIFERENTES, TRÊS FRASES DIFERENTES ────────────────────
     A primeira versão tinha duas: "não é da plataforma" e "não consegui
     carregar". Quem abrisse esta tela SEM TER FEITO LOGIN caía na primeira —
     e lia que a conta dele não era da plataforma, quando conta nenhuma
     estava em jogo. A pessoa vai conferir o super_admin, que está certo, e
     perde a tarde.

     Sem sessão, `Dados.chamar` vai como anônimo, o banco levanta
     `insufficient_privilege`, e a mensagem é idêntica à de uma conta comum.
     Só a TELA sabe distinguir — e por isso é ela que precisa perguntar
     primeiro se há alguém logado. */
  const temSessao = !!(Dados.sessaoAtual && Dados.sessaoAtual());
  if(!temSessao){
    document.getElementById('subtopo').textContent = '';
    corpo.innerHTML = `<div class="recado"><b>Você não está logado.</b>
      Esta tela lê o negócio inteiro, então ela precisa saber quem é você
      antes de mostrar qualquer número.<br><br>
      <a href="entrar.html" style="color:var(--az-claro,#93C5FD);font-weight:600">
      Entrar &rsaquo;</a></div>`;
    return;
  }

  try{
    painel = await Dados.chamar('painel_plataforma');
    if(Array.isArray(painel)) painel = painel[0];
    desenhar();
  }catch(e){
    console.error('[plataforma]', e);
    document.getElementById('subtopo').textContent = '';
    const negado = /privilege|permiss|plataforma abre/i.test(e.message || '');
    corpo.innerHTML = negado
      ? `<div class="recado erro"><b>Esta conta não é da plataforma.</b>
         Você está logado, mas esta conta não tem <code>super_admin</code>.
         O banco recusou, que é o certo — quem decide isso é o
         <code>is_super()</code>, não esta tela.<br><br>
         Para promover uma conta, rode <code>tests/promover_admin.sql</code> no
         SQL Editor do Supabase. Não existe botão para isso, de propósito:
         uma conta da plataforma lê a clientela de todos os salões, então a
         única porta é o painel do Supabase.</div>`
      : `<div class="recado erro"><b>Não consegui carregar o painel.</b>
         ${escapar(e.message)}</div>`;
  }
}

function desenhar(){
  const r = painel.resumo || {};
  const saloes = painel.saloes || [];
  const vencendo = painel.vencendo || [];

  document.getElementById('subtopo').textContent =
    saloes.length + (saloes.length === 1 ? ' salão cadastrado' : ' salões cadastrados');

  let h = `
  <div class="placar">
    <div class="cartao dinheiro">
      <div class="rot">Receita do mês</div>
      <div class="val">${real(r.mrr)}</div>
      <div class="pe">${r.pagantes || 0} pagando</div>
    </div>
    <div class="cartao">
      <div class="rot">Salões ativos</div>
      <div class="val">${r.saloes || 0}</div>
      <div class="pe">${r.suspensos || 0} suspenso(s)</div>
    </div>
    <div class="cartao">
      <div class="rot">Em teste</div>
      <div class="val">${r.em_teste || 0}</div>
      <div class="pe">viram receita ou somem</div>
    </div>
    <div class="cartao">
      <div class="rot">No gratuito</div>
      <div class="val">${r.no_gratuito || 0}</div>
      <div class="pe">crescem e viram plano</div>
    </div>
    ${(r.inadimplentes || 0) > 0 ? `
    <div class="cartao alerta">
      <div class="rot">Inadimplentes</div>
      <div class="val">${r.inadimplentes}</div>
      <div class="pe">cobrar ou suspender</div>
    </div>` : ''}
  </div>`;

  // O teste que vence é a única hora em que uma ligação muda o resultado.
  // Depois de vencido, já virou "aquele sistema que eu testei uma vez".
  if(vencendo.length){
    h += `<h2>Ligar esta semana · o teste vence</h2>`;
    h += vencendo.map(v => {
      const w = zap(v.whatsapp);
      const faltam = Number(v.faltam);
      return `<div class="ligar">
        <span class="quem">${escapar(v.nome)}</span>
        <span class="qdo">${faltam <= 0 ? 'vence hoje'
                          : faltam === 1 ? 'vence amanhã'
                          : 'faltam ' + faltam + ' dias'}</span>
        <span class="uso">${Number(v.agendamentos) > 0
          ? v.agendamentos + ' agendamento(s) — está usando'
          : 'nunca marcou nada — cadastrou e sumiu'}</span>
        ${w ? `<a href="${w}" target="_blank" rel="noopener">WhatsApp &rsaquo;</a>` : ''}
      </div>`;
    }).join('');
  }

  h += `<h2>Todos os salões</h2>`;
  if(!saloes.length){
    h += `<div class="rolo"><div class="vazio">Nenhum salão cadastrado ainda.</div></div>`;
  } else {
    h += `<div class="rolo"><table>
      <thead><tr>
        <th>Salão</th><th>Plano</th><th>Situação</th>
        <th class="num">Equipe</th><th class="num">Mês</th>
        <th>Último uso</th><th>Origem</th><th></th>
      </tr></thead><tbody>
      ${saloes.map(linhaSalao).join('')}
      </tbody></table></div>`;
  }

  document.getElementById('corpo').innerHTML = h;
}

function linhaSalao(s){
  const pago = Number(s.preco) > 0;
  const suspenso = s.status !== 'ativo';
  const etq = suspenso ? 'ruim'
            : s.assinatura === 'trial' ? 'teste'
            : pago ? 'pago' : 'gratis';

  // Equipe acima do limite do plano é dinheiro na mesa: o gatilho já barra
  // novos, mas o número mostra quem está espremido e pronto para subir.
  const noLimite = Number(s.profissionais) >= Number(s.limite);

  const opcoes = (painel.planos || []).map(p =>
    `<option value="${p.codigo}" ${p.codigo === s.plano ? 'selected' : ''}>
       ${escapar(p.nome)}${Number(p.preco) > 0 ? ' · ' + real(p.preco) : ''}
     </option>`).join('');

  return `<tr>
    <td><div class="nome">${escapar(s.nome)}</div>
        <div class="slug">${escapar(s.slug)}</div></td>
    <td><select class="plano" onchange="mudarPlano('${s.id}', this.value, this)">
          ${opcoes}</select></td>
    <td><span class="etq ${etq}">${suspenso ? 'suspenso'
         : s.assinatura === 'trial' ? 'teste até ' + data(s.trialAte)
         : pago ? 'pagando' : 'gratuito'}</span></td>
    <td class="num ${noLimite ? '' : 'morto'}">${s.profissionais}/${s.limite}</td>
    <td class="num ${Number(s.agendamentosMes) ? '' : 'morto'}">${s.agendamentosMes}</td>
    <td class="${s.ultimoAgendamento ? '' : 'morto'}">${desde(s.ultimoAgendamento)}</td>
    <td class="${s.origem ? '' : 'morto'}">${escapar(s.origem || '—')}</td>
    <td><button class="acao ${suspenso ? '' : 'perigo'}"
          onclick="mudarStatus('${s.id}', '${suspenso ? 'ativo' : 'suspenso'}', ${JSON.stringify(escapar(s.nome))})">
          ${suspenso ? 'Religar' : 'Suspender'}</button></td>
  </tr>`;
}

/* ── Mudar plano ──────────────────────────────────────────────────────────
   O `<select>` volta ao valor antigo se der errado. Sem isso a tela mostra
   uma coisa e o banco guarda outra, e a próxima decisão sai de um número que
   nunca existiu.
   ──────────────────────────────────────────────────────────────────────── */
async function mudarPlano(salaoId, plano, el){
  const antes = (painel.saloes.find(s => s.id === salaoId) || {}).plano;
  if(plano === antes) return;
  el.disabled = true;
  try{
    const r = await Dados.chamar('definir_plano', {
      p_salao: salaoId, p_plano: plano,
      // Gratuito não é assinatura ativa: é a ausência de uma. Marcar 'ativa'
      // com preço zero deixaria uma linha que diz "pagando R$ 0".
      p_status: plano === 'gratuito' ? 'cancelada' : 'ativa',
    });
    const v = Array.isArray(r) ? r[0] : r;
    // O banco pode discordar do que você pediu — plano ativo com data vencida
    // cai para gratuito na hora. Mostrar o EFETIVO evita a surpresa no mês
    // que vem.
    if(v && v.planoEfetivo && v.planoEfetivo !== plano){
      alert('O plano foi gravado como "' + plano + '", mas o que vale hoje é "'
          + v.planoEfetivo + '".\n\nQuase sempre isso quer dizer que a data de '
          + 'vencimento já passou.');
    }
    await carregar();
  }catch(e){
    console.error('[plataforma] mudar plano:', e);
    alert('Não consegui mudar o plano.\n\n' + e.message);
    el.value = antes;
    el.disabled = false;
  }
}

async function mudarStatus(salaoId, novo, nome){
  const suspender = novo === 'suspenso';
  if(suspender && !confirm(
      'Suspender ' + nome + '?\n\n'
    + 'O link de agendamento para de funcionar na hora e o salão some da '
    + 'vitrine. Nada é apagado: religando, a agenda volta inteira.')) return;
  try{
    await Dados.chamar('definir_status_salao', { p_salao: salaoId, p_status: novo });
    await carregar();
  }catch(e){
    console.error('[plataforma] mudar status:', e);
    alert('Não consegui mudar a situação do salão.\n\n' + e.message);
  }
}

async function sair(){
  if(!confirm('Sair da conta da plataforma neste aparelho?')) return;
  // Com `await`: sair da conta mais poderosa do sistema não pode ser uma
  // corrida entre apagar a sessão e trocar de página. Se a navegação vencer,
  // a sessão fica guardada no aparelho de onde você quis sair.
  try{ await Dados.sair(); }catch(e){ console.error('[plataforma] sair:', e); }
  location.href = 'entrar.html';
}

/* ── Partida ─────────────────────────────────────────────────────────────
   Em modo demonstração não há banco, e portanto não há plataforma: os dados
   moram no navegador de quem abriu, e "todos os salões" seria só ele mesmo.
   Dizer isso é melhor que desenhar um painel de mentira.
   ──────────────────────────────────────────────────────────────────────── */
(function(){
  if(!(window.AGENDAPRO && AGENDAPRO.url && AGENDAPRO.chave)){
    document.getElementById('subtopo').textContent = '';
    document.getElementById('corpo').innerHTML =
      `<div class="recado"><b>Esta tela precisa do banco de verdade.</b>
       Em modo demonstração os dados ficam no seu próprio navegador, então
       "todos os salões" seria só você — um painel que não mede nada.<br><br>
       Preencha <code>config.js</code> com a URL do projeto e a chave
       publicável para usar esta tela.</div>`;
    return;
  }
  carregar();
})();
</script>
</body>
</html>
