# ===========================================================================
# AgendaPro — as 12 suítes a cada envio
#
# POR QUE ISTO EXISTE
# A suíte só valia quando alguém lembrava de rodar. Nesta semana três defeitos
# chegaram ao ar por isso: o painel cunhava id que o Postgres recusa, a aba
# Equipe quebrava, e a tela da cliente dizia que o salão não existe. Todos
# teriam sido pegos por um teste que ninguém rodou naquele minuto.
#
# Aqui roda sozinho, no envio e no pull request, com um Postgres de serviço —
# não com o SQLite de mentirinha de ninguém. É o mesmo schema, o mesmo RLS e
# as mesmas policies que vão para o Supabase.
# ===========================================================================
name: Testes

on:
  push:
    branches: ['**']
  pull_request:
  # Para rodar à mão pelo botão, quando se quer conferir sem enviar nada.
  workflow_dispatch:

jobs:
  tudo:
    runs-on: ubuntu-latest

    services:
      postgres:
        # A mesma família do Supabase. Versão presa de propósito: "latest"
        # transforma uma manhã de trabalho em arqueologia no dia em que o
        # Postgres mudar alguma coisa.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      # O Playwright baixa o Chromium para cá; o passo de cache abaixo evita
      # baixar 130 MB a cada envio.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.navegadores

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cliente do Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dependências
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save pg playwright

      - name: Guardar o Chromium entre execuções
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.navegadores
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: chromium-${{ runner.os }}-

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # ── A bancada ────────────────────────────────────────────────────────
      # Um Postgres com o schema instalado + o PostgREST caseiro. É o que
      # permite testar a camada de dados contra RLS de verdade, sem precisar
      # de um projeto Supabase no ar.
      - name: Montar o banco da bancada
        run: |
          psql -q -d postgres -c "drop database if exists app;" -c "create database app;"
          psql -q -d app -v ON_ERROR_STOP=1 -f tests/00_stub_supabase.sql
          psql -q -d app -v ON_ERROR_STOP=1 -f supabase/00_tudo.sql 2>&1 | grep -v skipping || true
          psql -q -d app -c "grant usage on schema auth to anon, authenticated;"

      # Os servidores sobem NO MESMO passo dos testes, de propósito: processo
      # em segundo plano de um passo não tem sobrevida garantida no seguinte,
      # e a falha disso é confusa — a suíte reclama que a bancada não está no
      # ar, e o passo que a subiu aparece verde logo acima.
      - name: As 12 suítes
        env:
          PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright
          # O CHROMIUM não é passado de propósito: o tudo.sh pergunta ao
          # próprio Playwright onde ele está quando o caminho da máquina de
          # desenvolvimento não existe.
        run: |
          PGDATABASE=app node tests/bancada/postgrest.mjs > /tmp/bancada.log 2>&1 &
          python3 -m http.server 8099 --directory . > /tmp/estatico.log 2>&1 &

          # Esperar de verdade, em vez de dormir um número mágico: máquina de
          # CI é lenta em horário de pico, e `sleep 3` reprova sozinho.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8123/ \
              && curl -sf -o /dev/null http://127.0.0.1:8099/app.html \
              && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8123/ \
            || { echo "a bancada não subiu:"; cat /tmp/bancada.log; exit 1; }

          bash tests/tudo.sh
