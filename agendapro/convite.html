<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Convite — AgendaPro</title>
<meta name="description" content="Você foi convidada para trabalhar num salão no AgendaPro." />
<!-- Convite não é conteúdo para buscador: é um link privado que circula no
     WhatsApp. Indexado, ele vira porta aberta. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="icones/icone-192.png" />
<link rel="stylesheet" href="estilo.css" />
<style>
.conv-fora{ min-height:100vh; display:grid; place-items:center; padding:24px 16px }
.conv{
  width:100%; max-width:420px; background:var(--painel);
  border:1px solid var(--borda); border-radius:var(--r);
  box-shadow:var(--sombra-md); padding:26px 24px;
}
.conv-topo{ text-align:center; margin-bottom:20px }
.conv-logo{
  width:64px; height:64px; border-radius:16px; margin:0 auto 12px;
  display:grid; place-items:center; overflow:hidden;
  background:var(--grad-marca); color:#fff; font-weight:800; font-size:24px;
}
.conv-logo img{ width:100%; height:100%; object-fit:cover }
.conv-topo h1{ font-size:20px; letter-spacing:-.02em; margin:0 0 4px }
.conv-topo p{ color:var(--txt2); font-size:14px; margin:0 }
.conv-papel{
  display:inline-block; margin-top:10px; padding:5px 12px; border-radius:999px;
  background:var(--az-soft); color:var(--marca); font-size:13px; font-weight:700;
}
.conv .campo{ margin-bottom:12px }
.conv .btn{ width:100% }
.conv-troca{
  text-align:center; margin-top:14px; font-size:13px; color:var(--txt2);
}
.conv-troca button{
  border:0; background:transparent; color:var(--marca); cursor:pointer;
  font:inherit; font-weight:600; text-decoration:underline;
  text-underline-offset:2px; padding:10px 6px; min-height:40px;
}
.conv-erro{ margin-top:14px }
</style>
</head>
<body>

<div class="conv-fora">
  <div class="conv" id="caixa">
    <div class="conv-topo">
      <div class="conv-logo" id="convLogo">…</div>
      <h1 id="convTitulo">Abrindo o convite…</h1>
      <p id="convSub">Um instante.</p>
    </div>
    <div id="convCorpo"></div>
  </div>
</div>

<script src="icones.js"></script>
<script src="config.js"></script>
<script src="dados.js"></script>
<script>
/* ===========================================================================
   A página que a pessoa convidada abre.

   ── O QUE ELA PRECISA RESOLVER ─────────────────────────────────────────────
   Quem recebe o link pode estar em três estados, e a tela não pode pedir para
   a pessoa descobrir em qual está:

     1. já tem conta e está logada  → só confirma
     2. já tem conta e não está     → entra
     3. não tem conta               → cria

   O caminho 3 é o mais comum (é uma funcionária começando), e é por isso que
   ele é o formulário que abre primeiro.

   ── E O QUE ELA NÃO FAZ ────────────────────────────────────────────────────
   Não cria salão. `criar.html` cria; aqui a pessoa entra num salão que já
   existe. Confundir os dois daria à recepcionista um salão vazio no lugar do
   emprego dela.
   =========================================================================== */

const TOKEN = new URLSearchParams(location.search).get('c');

const $ = i => document.getElementById(i);
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const PAPEL = {
  admin:        'Administra o salão',
  recepcao:     'Recepção',
  profissional: 'Atende clientes',
};

function erro(msg){
  $('convCorpo').innerHTML =
    `<div class="aviso conv-erro">${esc(msg)}</div>`;
}

function ocupado(botao, sim){
  const b = $(botao);
  if(!b) return;
  b.disabled = sim;
  b.textContent = sim ? 'Um instante…' : b.dataset.txt;
}

/* ── Abrir ────────────────────────────────────────────────────────────── */
async function comecar(){
  if(!TOKEN){
    $('convTitulo').textContent = 'Convite não encontrado';
    $('convSub').textContent = 'O endereço veio sem o código.';
    return erro('Peça ao salão para mandar o link de novo.');
  }

  let c;
  try{
    c = await Dados.chamar('ver_convite', { p_token: TOKEN });
  }catch(e){
    $('convTitulo').textContent = 'Não consegui abrir';
    $('convSub').textContent = 'Tente de novo em um minuto.';
    return erro(e.message || 'Falha de conexão.');
  }

  /* Convite inválido, vencido e revogado dão a MESMA resposta — é assim que
     o banco devolve, de propósito. Separar os três aqui contaria a quem está
     adivinhando que ele acertou o formato e errou só a validade. */
  if(!c || !c.valido){
    $('convLogo').textContent = '·';
    $('convTitulo').textContent = 'Este convite não vale mais';
    $('convSub').textContent = 'Ele pode ter vencido, já ter sido usado, '
                             + 'ou o salão pode tê-lo cancelado.';
    return erro('Peça um convite novo a quem administra o salão.');
  }

  $('convLogo').innerHTML = c.logo
    ? `<img src="${esc(c.logo)}" alt="">`
    : esc((c.salao || '?').trim().charAt(0).toUpperCase());
  $('convTitulo').textContent = c.salao;
  $('convSub').innerHTML = c.paraQuem
    ? `Convite para <b>${esc(c.paraQuem)}</b>`
    : 'Você foi convidada para a equipe.';
  $('convTitulo').insertAdjacentHTML('afterend',
    `<div class="conv-papel">${esc(PAPEL[c.papel] || c.papel)}</div>`);

  // Já logada: nada de formulário, só o botão.
  if(Dados.ligado && Dados.sessao && Dados.sessao()){
    return telaConfirmar();
  }
  telaCriarConta();
}

/* ── Já está logada ───────────────────────────────────────────────────── */
function telaConfirmar(){
  $('convCorpo').innerHTML = `
    <p style="color:var(--txt2);font-size:14px;margin-bottom:14px">
      Você já está com a sua conta aberta. É só aceitar.</p>
    <button class="btn btn-p" id="btAceitar" data-txt="Aceitar convite"
            onclick="aceitar()">Aceitar convite</button>
    <div class="conv-troca">
      <button type="button" onclick="sairEEntrarComOutra()">Entrar com outra conta</button>
    </div>`;
}

/* ── Criar conta ──────────────────────────────────────────────────────── */
function telaCriarConta(){
  $('convCorpo').innerHTML = `
    <div class="campo"><label for="cNome">Seu nome</label>
      <input id="cNome" autocomplete="name" placeholder="Como as clientes te chamam"></div>
    <div class="campo"><label for="cEmail">E-mail</label>
      <input id="cEmail" type="email" autocomplete="email" placeholder="voce@email.com"></div>
    <div class="campo"><label for="cTel">WhatsApp</label>
      <input id="cTel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999"></div>
    <div class="campo"><label for="cSenha">Crie uma senha</label>
      <input id="cSenha" type="password" autocomplete="new-password"
             placeholder="pelo menos 8 letras"></div>
    <button class="btn btn-p" id="btCriar" data-txt="Criar conta e entrar"
            onclick="criarEAceitar()">Criar conta e entrar</button>
    <div class="conv-troca">
      Já tem conta no AgendaPro?
      <button type="button" onclick="telaEntrar()">Entrar</button>
    </div>`;
}

/* ── Entrar com conta existente ───────────────────────────────────────── */
function telaEntrar(){
  $('convCorpo').innerHTML = `
    <div class="campo"><label for="eEmail">E-mail</label>
      <input id="eEmail" type="email" autocomplete="email" placeholder="voce@email.com"></div>
    <div class="campo"><label for="eSenha">Senha</label>
      <input id="eSenha" type="password" autocomplete="current-password"></div>
    <button class="btn btn-p" id="btEntrar" data-txt="Entrar e aceitar"
            onclick="entrarEAceitar()">Entrar e aceitar</button>
    <div class="conv-troca">
      Ainda não tem conta?
      <button type="button" onclick="telaCriarConta()">Criar</button>
    </div>`;
}

async function sairEEntrarComOutra(){
  try{ await Dados.sair(); }catch(e){}
  telaEntrar();
}

/* ── Os três caminhos terminam no mesmo lugar ─────────────────────────── */
async function criarEAceitar(){
  const nome  = ($('cNome').value  || '').trim();
  const email = ($('cEmail').value || '').trim();
  const tel   = ($('cTel').value   || '').trim();
  const senha = $('cSenha').value  || '';
  if(nome.length < 2)  return erro('Diga seu nome.');
  if(!email.includes('@')) return erro('Confira o e-mail.');
  if(senha.length < 8) return erro('A senha precisa de pelo menos 8 letras.');

  ocupado('btCriar', true);
  try{
    await Dados.criarConta({ email, senha, nome, telefone: tel });
    await aceitar();
  }catch(e){
    ocupado('btCriar', false);
    /* Conta que já existe é o engano mais comum aqui: a pessoa esqueceu que
       já tinha usado o AgendaPro como cliente de algum salão. Em vez de
       repetir o erro do servidor, a tela oferece o caminho certo. */
    if(/already|registered|existe/i.test(e.message || '')){
      erro('Você já tem conta com este e-mail. Use "Entrar" logo abaixo.');
      return;
    }
    erro(e.message || 'Não consegui criar a conta.');
  }
}

async function entrarEAceitar(){
  const email = ($('eEmail').value || '').trim();
  const senha = $('eSenha').value  || '';
  if(!email || !senha) return erro('Preencha e-mail e senha.');
  ocupado('btEntrar', true);
  try{
    await Dados.entrar({ email, senha });
    await aceitar();
  }catch(e){
    ocupado('btEntrar', false);
    erro(e.message || 'E-mail ou senha não conferem.');
  }
}

async function aceitar(){
  ocupado('btAceitar', true);
  try{
    await Dados.chamar('aceitar_convite', { p_token: TOKEN });
    /* Vai direto para o painel. A pessoa não precisa saber que existe uma
       tela de login: ela clicou num link e entrou no trabalho. */
    location.replace('app.html');
  }catch(e){
    ocupado('btAceitar', false);
    erro(e.message || 'Não consegui aceitar o convite.');
  }
}

comecar();
</script>
</body>
</html>
