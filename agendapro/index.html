<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgendaPro</title>
<meta name="theme-color" content="#FFFFFF" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icones/icone-192.png" />
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
<!-- A raiz só encaminha para o app. Mesmo arranjo do AdminPro: quem digita o
     domínio cai direto na agenda, sem página intermediária. O <meta refresh>
     fica como rede para navegador com JavaScript desligado. -->
<meta http-equiv="refresh" content="0; url=entrar.html" />
<script>
/* ── O LINK DO E-MAIL PODE CAIR AQUI, E O TOKEN NÃO PODE MORRER NO CAMINHO ──
   O Supabase só respeita o `redirect_to` que a gente manda se ele estiver na
   lista de Redirect URLs do projeto. Fora dela — e por descuido ela fica
   fora — ele devolve a pessoa para o "Site URL", que costuma ser a raiz do
   site. Ou seja: aqui.

   E aqui o `location.replace('entrar.html')` jogava o #fragmento FORA. Com
   ele ia embora o token de recuperação, que É a prova de identidade de quem
   esqueceu a senha. A pessoa clicava no link, via a tela de login pedindo a
   senha que ela não lembra, e concluía que o sistema está quebrado.

   Então o fragmento viaja junto, e cada tipo vai para o seu lugar:
   recuperação para trocar a senha, o resto para entrar. Assim o caminho
   funciona mesmo com a lista de Redirect URLs mal configurada — desde que o
   Site URL aponte para o site. */
(function(){
  var h = location.hash || '';
  var destino = 'entrar.html';
  if(h.length > 1){
    var f = new URLSearchParams(h.slice(1));
    if(f.get('type') === 'recovery' || f.get('access_token') || f.get('error')){
      if(f.get('type') === 'recovery') destino = 'nova-senha.html';
      destino += h;
    }
  }
  location.replace(destino);
})();
</script>
<style>
  body{
    margin:0;height:100vh;display:grid;place-items:center;
    font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#F7F6F4;color:#5B574F;
  }
  a{color:#1D4ED8;font-weight:600}
</style>
</head>
<body>
  <p>Abrindo o AgendaPro… <a href="entrar.html">entrar agora</a></p>
</body>
</html>
